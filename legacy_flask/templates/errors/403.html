{% extends "base.html" %}

{% block title %}403 Forbidden - Access Denied{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="stat-icon bg-danger-subtle text-danger mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
            <i class="bi bi-shield-slash"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark">403 - Access Denied</h1>
        <p class="lead text-secondary mb-4">{{ description or "You do not have administrative or authorization privileges to access this resource." }}</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4">Return Home</a>
            <button onclick="history.back()" class="btn btn-outline-secondary px-4">Go Back</button>
        </div>
    </div>
</div>
{% endblock %}
