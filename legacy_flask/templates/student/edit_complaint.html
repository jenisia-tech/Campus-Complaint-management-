{% extends "base.html" %}

{% block title %}Edit Complaint {{ complaint.complaint_id }} - Campus Complaint Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h2 class="fw-bold mb-1">Edit Complaint: {{ complaint.complaint_id }}</h2>
                <p class="text-muted mb-0">Modify complaint details while it remains in 'Submitted' status.</p>
            </div>
            <a href="{{ url_for('student.complaint_detail', complaint_id=complaint.complaint_id) }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Cancel
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('student.edit_complaint', complaint_id=complaint.complaint_id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Complaint Subject / Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg" id="title" name="title"
                               value="{{ complaint.title }}" required minlength="5" maxlength="150">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" name="category" required>
                                {% for cat in categories %}
                                    <option value="{{ cat }}" {% if complaint.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="priority" class="form-label fw-semibold">Suggested Priority <span class="text-danger">*</span></label>
                            <select class="form-select" id="priority" name="priority" required>
                                {% for prio in priorities %}
                                    <option value="{{ prio }}" {% if complaint.priority == prio %}selected{% endif %}>{{ prio }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="location" class="form-label fw-semibold">Campus Location / Room <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="location" name="location"
                                   value="{{ complaint.location }}" required minlength="2" maxlength="100">
                        </div>
                        <div class="col-md-6">
                            <label for="department" class="form-label fw-semibold">Department Responsible <span class="text-danger">*</span></label>
                            <select class="form-select" id="department" name="department" required>
                                {% for dept in departments %}
                                    <option value="{{ dept }}" {% if complaint.department == dept %}selected{% endif %}>{{ dept }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">Detailed Description <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="description" name="description" rows="5"
                                  required minlength="10" maxlength="3000">{{ complaint.description }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('student.complaint_detail', complaint_id=complaint.complaint_id) }}" class="btn btn-light px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                            <i class="bi bi-check-lg me-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
