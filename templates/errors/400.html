{% extends "base.html" %}

{% block title %}400 Bad Request - Campus Complaint Management{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="stat-icon bg-warning-subtle text-warning mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
            <i class="bi bi-shield-exclamation"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark">400 - Invalid Request</h1>
        <p class="lead text-secondary mb-4">{{ description or "The server could not understand or verify your request." }}</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4">Return Home</a>
            <button onclick="history.back()" class="btn btn-outline-secondary px-4">Go Back</button>
        </div>
    </div>
</div>
{% endblock %}
